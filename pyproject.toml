[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "nori-captioner"
version = "0.1.0"
description = "Simple local web UI for captioning image/video datasets with optional local VLM auto-captioning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Yuichi Tadokoro", email = "tokoro10g@tokor.org" },
]
keywords = ["captioning", "dataset", "vlm", "vision", "image", "video", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pillow>=10.0.0",
  "av>=12.0.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
  "rich>=13.7.0",
  "compressed-tensors>=0.14.0.1",
]

[project.optional-dependencies]
vlm = [
  "transformers>=4.57.0",
  "torch>=2.8.0",
  "torchvision>=0.23.0",
  "accelerate>=0.34.0",
  "qwen-vl-utils>=0.0.11",
]
quantize = [
  "bitsandbytes>=0.43.1",
]

[project.scripts]
nori-captioner = "nori_captioner.__main__:main"

[project.urls]
Source = "https://github.com/tokoro10g/nori-captioner"
Issues = "https://github.com/tokoro10g/nori-captioner/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nori_captioner"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
  "ruff>=0.15.7",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  ".git",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
]
